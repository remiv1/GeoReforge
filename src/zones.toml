source_path = "https://naturalearth.s3.amazonaws.com"

[data_family]
raster = []

[[data_family.cultural]]
name = "Countries"
precision = [
    "high",
    "medium",
    "low",
]
link = "admin_0_countries"

[[data_family.physical]]
name = "Lakes"
precision = [
    "high",
    "medium",
    "low",
]
link = "lakes"

[[data_family.physical]]
name = "Ocean"
precision = [
    "high",
    "medium",
    "low",
]
link = "ocean"

[data_family.mapping.lakes]
name = "name_en"
code = "ne_id"
geometry = "geometry"
class = "featurecla"

[data_family.mapping.lakes.classes]
Lake = "Lac"
Reservoir = "Réservoir"
"Alkaline Lake" = "Lac Alcalin"

[data_family.mapping.ocean]
name = "featurecla"
code = "featurecla"
geometry = "geometry"
class = "featurecla"

[data_family.mapping.ocean.classes]
Ocean = "Océan"

[data_family.mapping.admin_0_countries]
name = "NAME_LONG"
code = "ISO_A3"
geometry = "geometry"
class = "featurecla"

[data_family.mapping.admin_0_countries.classes]
"Admin-0 country" = "Pays"
