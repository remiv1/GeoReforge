# Evironnement lié à l'arborescence du projet GeoReforge
APP_CONFIG=/etc/app/config.yaml
DATABASE_URL=/var/lib/app/database.db

# Environnement lié à la base de données
EXTERNAL_DB=false
DB_TYPE=sqlite
DB_ENGINE=sqlite
DB_PORT=0000
DB_USER=appuser
DB_PASSWORD=appuserpassword
DB_NAME=appdb
DB_SCHEMA=public
DB_HOST=localhost

# Environnement lié à la journalisation (logging)
LOG_LEVEL=info

# Environnement lié à l'application Flask
FLASK_ENV=production
FLASK_DEBUG=false
FLASK_APP=/app/api/main.py
SECRET_KEY=default_secret_key